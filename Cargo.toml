[package]
name = "flik"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A local terminal log explorer with smart filters, context and incident analysis."

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
unicode-width = "0.2"
chrono = "0.4"
parking_lot = "0.12"
libc = "0.2"
tempfile = "3.10"

